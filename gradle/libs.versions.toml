[versions]
clikt = "5.0.1"
directories = "26"
freemarker = "2.3.34"
jreleaser = "1.25.0"
kobweb-cli = "0.9.22-SNAPSHOT"
kobweb-libs = "0.25.0"
kotter = "1.4.0"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
okhttp = "5.4.0"
shadow = "9.6.1"

[libraries]
clikt-core = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
directories = { module = "dev.dirs:directories", version.ref = "directories" }
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }
kobweb-common = { module = "com.varabyte.kobweb:kobweb-common", version.ref = "kobweb-libs" }
kotter = { module = "com.varabyte.kotter:kotter", version.ref = "kotter" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
